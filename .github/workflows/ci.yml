name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The whole suite runs against fixtures. If a test ever reaches the network,
      # it will be flaky in someone else's CI before it is flaky in ours.
      - name: No test may touch the network
        run: |
          node --test test/*.test.mjs 2>&1 | tee out.txt
          ! grep -qiE "ENOTFOUND|EAI_AGAIN|getaddrinfo" out.txt
